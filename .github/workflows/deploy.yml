name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: translations-google-v2-${{ hashFiles('content/**/index.zh.md', 'scripts/translate_posts.py', 'scripts/requirements-translate.txt') }}
          restore-keys: |
            translations-google-v2-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-translate.txt

      - name: Install translation dependencies
        continue-on-error: true
        run: python3 -m pip install -r scripts/requirements-translate.txt

      - name: Generate English pages
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/translate_posts.py

      - name: Build
        run: hugo --gc --minify --baseURL "https://fliaz.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
